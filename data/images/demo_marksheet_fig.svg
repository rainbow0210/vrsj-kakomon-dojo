<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-label="サンプル図：VRヘッドセットの座標軸と回転（マークシート＋図表表示デモ）">
  <rect width="640" height="340" fill="#ffffff"/>
  <rect x="12" y="12" width="616" height="316" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <text x="32" y="42" font-family="sans-serif" font-size="15" font-weight="700" fill="#0f172a">サンプル図（第2問）：HMDの3次元座標軸と回転の概念図</text>
  <text x="32" y="62" font-family="sans-serif" font-size="12" fill="#475569">図表を含む問題では画像を表示し、タップ／クリックで拡大確認できます</text>

  <!-- Coordinate Axes Center (310, 195) -->
  <!-- Y axis (Vertical - Yaw) -->
  <line x1="310" y1="295" x2="310" y2="95" stroke="#0284c7" stroke-width="2.5"/>
  <polygon points="310,85 304,98 316,98" fill="#0284c7"/>
  <text x="320" y="96" font-family="sans-serif" font-size="13" font-weight="700" fill="#0369a1">Y軸（上下）</text>

  <!-- X axis (Horizontal - Pitch) -->
  <line x1="165" y1="195" x2="465" y2="195" stroke="#059669" stroke-width="2.5"/>
  <polygon points="475,195 462,189 462,201" fill="#059669"/>
  <text x="480" y="200" font-family="sans-serif" font-size="13" font-weight="700" fill="#047857">X軸（左右）</text>

  <!-- Z axis (Depth - Roll) -->
  <line x1="400" y1="125" x2="210" y2="268" stroke="#7c3aed" stroke-width="2.5"/>
  <polygon points="200,275 215,272 208,261" fill="#7c3aed"/>
  <text x="112" y="290" font-family="sans-serif" font-size="13" font-weight="700" fill="#6d28d9">Z軸（前後・視線方向）</text>

  <!-- HMD Icon at Center -->
  <g transform="translate(262, 165)">
    <rect x="0" y="0" width="96" height="58" rx="14" fill="#4338ca" stroke="#312e81" stroke-width="2"/>
    <rect x="12" y="13" width="30" height="24" rx="6" fill="#e0e7ff"/>
    <rect x="54" y="13" width="30" height="24" rx="6" fill="#e0e7ff"/>
    <path d="M36 58 L44 46 Q48 42 52 46 L60 58" fill="#f8fafc"/>
    <text x="48" y="30" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#312e81">HMD</text>
  </g>

  <!-- Rotation Arcs & Choice Labels -->
  <!-- ア: Pitch (around X) -->
  <path d="M415 170 A22 32 0 1 1 415 220" fill="none" stroke="#059669" stroke-width="2.2" stroke-dasharray="4 3"/>
  <polygon points="415,224 410,214 421,215" fill="#059669"/>
  <g transform="translate(458, 128)">
    <rect width="144" height="36" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <circle cx="18" cy="18" r="11" fill="#059669"/>
    <text x="18" y="22" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">ア</text>
    <text x="36" y="23" font-family="sans-serif" font-size="12" font-weight="700" fill="#065f46">ピッチ（Pitch）</text>
  </g>

  <!-- イ: Yaw (around Y) -->
  <path d="M278 125 A36 14 0 1 1 342 125" fill="none" stroke="#0284c7" stroke-width="2.2" stroke-dasharray="4 3"/>
  <polygon points="346,125 336,120 338,131" fill="#0284c7"/>
  <g transform="translate(36, 98)">
    <rect width="144" height="36" rx="8" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5"/>
    <circle cx="18" cy="18" r="11" fill="#0284c7"/>
    <text x="18" y="22" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">イ</text>
    <text x="36" y="23" font-family="sans-serif" font-size="12" font-weight="700" fill="#075985">ヨー（Yaw）</text>
  </g>

  <!-- ウ: Roll (around Z) -->
  <path d="M225 225 A26 26 0 1 0 264 252" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <polygon points="268,250 257,248 262,258" fill="#7c3aed"/>
  <g transform="translate(36, 178)">
    <rect width="154" height="44" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
    <circle cx="20" cy="22" r="12" fill="#7c3aed"/>
    <text x="20" y="26" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">ウ</text>
    <text x="40" y="20" font-family="sans-serif" font-size="12" font-weight="700" fill="#581c87">ロール（Roll）</text>
    <text x="40" y="36" font-family="sans-serif" font-size="10.5" fill="#6b21a8">Z軸まわりの傾き</text>
  </g>

  <!-- エ: Translation -->
  <g transform="translate(432, 246)">
    <rect width="170" height="36" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="18" cy="18" r="11" fill="#475569"/>
    <text x="18" y="22" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">エ</text>
    <text x="36" y="23" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155">並進移動（3軸）</text>
  </g>

  <!-- Footer Note -->
  <text x="32" y="316" font-family="sans-serif" font-size="11" fill="#64748b">※ マークシート＋図表デモ：Z軸（視線方向）まわりの回転に該当する記号は「ウ」</text>
</svg>
